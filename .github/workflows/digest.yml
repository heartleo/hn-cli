name: digest

on:
  schedule:
    # Hourly. GitHub runs scheduled workflows late at peak times, often by tens
    # of minutes — this is "about once an hour", not "on the hour".
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate even if the front page has not changed'
        type: boolean
        default: false
      model:
        description: 'Model id (default: openai/gpt-4o)'
        type: string
        default: ''

# models: read lets the built-in GITHUB_TOKEN call GitHub Models — no secret to
# configure. contents: write is for committing the generated pages.
permissions:
  contents: write
  models: read

# A slow run must not overlap the next hourly tick and race it to the same files.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HN_DIGEST_MODEL: ${{ inputs.model }}
        run: go run ./cmd/hn-digest ${{ inputs.force && '--force' || '' }}

      - name: Commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage first, then test the index. `git diff -- docs` only sees
          # modifications to tracked files, so on the very first run — when the
          # pages are brand-new and untracked — it reports no change and the
          # commit is skipped. Staging brings untracked files into the diff.
          git add docs
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: update digest $(date -u +'%Y-%m-%d %H:%M UTC')"
          # The hourly tick and a manual run can both be mid-flight; rebase
          # rather than fail on a push race.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
