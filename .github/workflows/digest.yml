name: digest

on:
  schedule:
    # Once a day at 00:00 UTC. GitHub runs scheduled workflows late at peak
    # times, often by tens of minutes — this is "about midnight UTC", not "on
    # the stroke of midnight".
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate"
        type: boolean
        default: false
      # A workflow_dispatch default has to be a literal — GitHub does not
      # evaluate ${{ vars.* }} in the `on:` block — so these boxes cannot be
      # pre-filled with what the repository is configured with. Blank means
      # "use the repository setting"; the run's summary prints what won.
      api_url:
        description: "API Base URL"
        type: string
        default: ""
      model:
        description: "API Model"
        type: string
        default: ""
      # There is deliberately no api_key input. A workflow_dispatch input is
      # echoed back on the run's own page, and this repository is public, so a
      # key typed into the form would be readable by anyone forever — masking
      # only covers log lines, not that header. Ad-hoc keys go in the
      # HN_DIGEST_API_KEY secret instead.

permissions:
  contents: read
  pages: write
  id-token: write

# Deployments to the github-pages environment already serialize by
# themselves; this group only needs to stop two `generate` runs (schedule +
# a manual dispatch) racing on the same restored docs/state.json.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  generate:
    # Manual runs are owner-only. Dispatching already needs write access, but
    # spelling it out means adding a collaborator does not silently hand out a
    # button that spends the model quota. `triggering_actor` is whoever pressed
    # the button — on a re-run, `actor` is still whoever started the original.
    # The scheduled tick is exempt: it has no meaningful actor.
    if: github.event_name != 'workflow_dispatch' || github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    # The program's own context deadline is 10 minutes; this is the outer bound
    # that also covers checkout and the Go build.
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # docs/index.html, docs/en/index.html and docs/state.json are generated
      # output — deployed straight to Pages below, never committed to the
      # repo. A fresh checkout has none of them, so the change-detection
      # fingerprint in state.json has to come from somewhere else: the site
      # GitHub Pages is already serving is that record. Best-effort — on the
      # very first run after this migration, or if the site is briefly
      # unreachable, a missing state.json just means this run regenerates
      # instead of skipping, which is safe.
      - name: Restore previous state from the live site
        run: curl -fsSL https://hndigest.heartleo.dev/state.json -o docs/state.json || true

      # HN_DIGEST_API_URL / HN_DIGEST_MODEL are repository variables, not
      # secrets: an endpoint and a model name are not confidential, and keeping
      # them readable is what makes a misrouted request diagnosable from the log.
      # HN_DIGEST_API_KEY is the one real secret.
      - name: Show effective config
        env:
          API_URL: ${{ inputs.api_url || vars.HN_DIGEST_API_URL }}
          MODEL: ${{ inputs.model || vars.HN_DIGEST_MODEL }}
        run: |
          {
            echo "| setting | value |"
            echo "| --- | --- |"
            echo "| API URL | ${API_URL:-(built-in default)} |"
            echo "| model | ${MODEL:-(built-in default)} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Dispatch inputs reach the shell as environment variables, never spliced
      # into the script text — an expression that lands inside `run:` is a
      # command-injection site the moment an input stops being trusted.
      - name: Generate digest
        id: run
        env:
          HN_DIGEST_API_KEY: ${{ secrets.HN_DIGEST_API_KEY }}
          HN_DIGEST_API_URL: ${{ inputs.api_url || vars.HN_DIGEST_API_URL }}
          HN_DIGEST_MODEL: ${{ inputs.model || vars.HN_DIGEST_MODEL }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            out=$(go run ./cmd/hn-digest --force)
          else
            out=$(go run ./cmd/hn-digest)
          fi
          echo "$out"
          # The program's only machine-readable signal for "nothing to do" is
          # this line in its own stdout — see cmd/hn-digest/main.go. Anything
          # else (including a build failure, which never reaches this line)
          # already failed the step via `go run`'s own exit code.
          if echo "$out" | grep -q "^front page unchanged"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The live site is unchanged; redeploying identical bytes would just
      # spend a Pages deployment for nothing.
      - if: steps.run.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - if: steps.run.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
