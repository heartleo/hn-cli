name: digest

on:
  schedule:
    # Once a day at 00:00 UTC. GitHub runs scheduled workflows late at peak
    # times, often by tens of minutes — this is "about midnight UTC", not "on
    # the stroke of midnight".
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate"
        type: boolean
        default: false
      # A workflow_dispatch default has to be a literal — GitHub does not
      # evaluate ${{ vars.* }} in the `on:` block — so these boxes cannot be
      # pre-filled with what the repository is configured with. Blank means
      # "use the repository setting"; the run's summary prints what won.
      api_url:
        description: "API Base URL"
        type: string
        default: ""
      model:
        description: "API Model"
        type: string
        default: ""
      # There is deliberately no api_key input. A workflow_dispatch input is
      # echoed back on the run's own page, and this repository is public, so a
      # key typed into the form would be readable by anyone forever — masking
      # only covers log lines, not that header. Ad-hoc keys go in the
      # HN_DIGEST_API_KEY secret instead.

# contents: write is for committing the generated pages.
permissions:
  contents: write

# A slow run must not overlap a manual dispatch and race it to the same files.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  generate:
    # Manual runs are owner-only. Dispatching already needs write access, but
    # spelling it out means adding a collaborator does not silently hand out a
    # button that spends the model quota. `triggering_actor` is whoever pressed
    # the button — on a re-run, `actor` is still whoever started the original.
    # The scheduled tick is exempt: it has no meaningful actor.
    if: github.event_name != 'workflow_dispatch' || github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    # The program's own context deadline is 10 minutes; this is the outer bound
    # that also covers checkout, the Go build, and a wedged push.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # HN_DIGEST_API_URL / HN_DIGEST_MODEL are repository variables, not
      # secrets: an endpoint and a model name are not confidential, and keeping
      # them readable is what makes a misrouted request diagnosable from the log.
      # HN_DIGEST_API_KEY is the one real secret.
      #
      # This used to run on GitHub Models with the built-in GITHUB_TOKEN and no
      # secret at all, but GitHub retired that service on 2026-07-30 and the
      # endpoint now returns 410 for everyone.
      - name: Show effective config
        env:
          API_URL: ${{ inputs.api_url || vars.HN_DIGEST_API_URL }}
          MODEL: ${{ inputs.model || vars.HN_DIGEST_MODEL }}
        run: |
          {
            echo "| setting | value |"
            echo "| --- | --- |"
            echo "| API URL | ${API_URL:-(built-in default)} |"
            echo "| model | ${MODEL:-(built-in default)} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Dispatch inputs reach the shell as environment variables, never spliced
      # into the script text — an expression that lands inside `run:` is a
      # command-injection site the moment an input stops being trusted.
      - name: Generate digest
        env:
          HN_DIGEST_API_KEY: ${{ secrets.HN_DIGEST_API_KEY }}
          HN_DIGEST_API_URL: ${{ inputs.api_url || vars.HN_DIGEST_API_URL }}
          HN_DIGEST_MODEL: ${{ inputs.model || vars.HN_DIGEST_MODEL }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            go run ./cmd/hn-digest --force
          else
            go run ./cmd/hn-digest
          fi

      - name: Commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage first, then test the index. `git diff -- docs` only sees
          # modifications to tracked files, so on the very first run — when the
          # pages are brand-new and untracked — it reports no change and the
          # commit is skipped. Staging brings untracked files into the diff.
          git add docs
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: update digest $(date -u +'%Y-%m-%d %H:%M UTC')"
          # The scheduled tick and a manual run can both be mid-flight; rebase
          # rather than fail on a push race.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
