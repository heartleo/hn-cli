name: digest

on:
  schedule:
    # Once a day at 00:00 UTC. GitHub runs scheduled workflows late at peak
    # times, often by tens of minutes — this is "about midnight UTC", not "on
    # the stroke of midnight".
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate even if the front page has not changed'
        type: boolean
        default: false
      model:
        description: 'Model id (default: openai/gpt-oss-120b)'
        type: string
        default: ''

# contents: write is for committing the generated pages.
permissions:
  contents: write

# A slow run must not overlap a manual dispatch and race it to the same files.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # HN_DIGEST_API_KEY is a repository secret — a free Groq key from
      # https://console.groq.com/keys. This used to run on GitHub Models with
      # the built-in GITHUB_TOKEN and no secret, but GitHub retired that
      # service on 2026-07-30 and the endpoint now returns 410 for everyone.
      #
      # HN_DIGEST_API_URL / HN_DIGEST_MODEL are optional repository variables:
      # set them to move to another OpenAI-compatible provider without a code
      # change. Empty means the Groq defaults in internal/digest/llm.go.
      - name: Generate digest
        env:
          HN_DIGEST_API_KEY: ${{ secrets.HN_DIGEST_API_KEY }}
          HN_DIGEST_API_URL: ${{ vars.HN_DIGEST_API_URL }}
          HN_DIGEST_MODEL: ${{ inputs.model || vars.HN_DIGEST_MODEL }}
        run: go run ./cmd/hn-digest ${{ inputs.force && '--force' || '' }}

      - name: Commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage first, then test the index. `git diff -- docs` only sees
          # modifications to tracked files, so on the very first run — when the
          # pages are brand-new and untracked — it reports no change and the
          # commit is skipped. Staging brings untracked files into the diff.
          git add docs
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: update digest $(date -u +'%Y-%m-%d %H:%M UTC')"
          # The scheduled tick and a manual run can both be mid-flight; rebase
          # rather than fail on a push race.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
