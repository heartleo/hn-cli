name: digest

on:
  schedule:
    # Once a day at 00:00 UTC. GitHub runs scheduled workflows late at peak
    # times, often by tens of minutes — this is "about midnight UTC", not "on
    # the stroke of midnight".
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate"
        type: boolean
        default: false
      # A workflow_dispatch default has to be a literal — GitHub does not
      # evaluate ${{ vars.* }} in the `on:` block — so these boxes cannot be
      # pre-filled with what the repository is configured with. Blank means
      # "use the repository setting"; the run's summary prints what won.
      api_url:
        description: "API Base URL"
        type: string
        default: ""
      model:
        description: "API Model"
        type: string
        default: ""
      api_key:
        description: "API Key"
        type: string
        default: ""

# contents: write is for committing the generated pages.
permissions:
  contents: write

# A slow run must not overlap a manual dispatch and race it to the same files.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A key typed into the dispatch form is already recorded in the run's
      # event payload, which nothing can undo — but masking it here at least
      # keeps it out of every log line that follows.
      - name: Mask an ad-hoc key
        if: inputs.api_key != ''
        env:
          KEY: ${{ inputs.api_key }}
        run: echo "::add-mask::$KEY"

      # HN_DIGEST_API_URL / HN_DIGEST_MODEL are repository variables, not
      # secrets: an endpoint and a model name are not confidential, and keeping
      # them readable is what makes a misrouted request diagnosable from the log.
      # HN_DIGEST_API_KEY is the one real secret.
      #
      # This used to run on GitHub Models with the built-in GITHUB_TOKEN and no
      # secret at all, but GitHub retired that service on 2026-07-30 and the
      # endpoint now returns 410 for everyone.
      - name: Show effective config
        env:
          API_URL: ${{ inputs.api_url || vars.HN_DIGEST_API_URL }}
          MODEL: ${{ inputs.model || vars.HN_DIGEST_MODEL }}
          KEY_SOURCE: ${{ inputs.api_key != '' && 'dispatch input' || 'repo secret' }}
        run: |
          {
            echo "| setting | value |"
            echo "| --- | --- |"
            echo "| API URL | ${API_URL:-(built-in default)} |"
            echo "| model | ${MODEL:-(built-in default)} |"
            echo "| key from | $KEY_SOURCE |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate digest
        env:
          HN_DIGEST_API_KEY: ${{ inputs.api_key || secrets.HN_DIGEST_API_KEY }}
          HN_DIGEST_API_URL: ${{ inputs.api_url || vars.HN_DIGEST_API_URL }}
          HN_DIGEST_MODEL: ${{ inputs.model || vars.HN_DIGEST_MODEL }}
        run: go run ./cmd/hn-digest ${{ inputs.force && '--force' || '' }}

      - name: Commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage first, then test the index. `git diff -- docs` only sees
          # modifications to tracked files, so on the very first run — when the
          # pages are brand-new and untracked — it reports no change and the
          # commit is skipped. Staging brings untracked files into the diff.
          git add docs
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: update digest $(date -u +'%Y-%m-%d %H:%M UTC')"
          # The scheduled tick and a manual run can both be mid-flight; rebase
          # rather than fail on a push race.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
